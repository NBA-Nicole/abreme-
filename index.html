<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Feliz cumpleaños y feliz Navidad</title>
<style>
html,body{margin:0;height:100%;background:#010301;overflow:hidden;font-family:'Courier New',monospace}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#msg{position:fixed;z-index:20;left:0;right:0;bottom:4vh;text-align:center;min-height:2.6em;font:700 clamp(18px,5vw,34px) "Courier New",monospace;color:#ffd54a;text-shadow:0 0 14px rgba(255,200,60,.65);letter-spacing:.06em;pointer-events:none;padding:0 14px;line-height:1.3}
#emo{display:inline-block;animation:w .6s ease-in-out infinite alternate}
@keyframes w{from{transform:rotate(-14deg) scale(1)}to{transform:rotate(14deg) scale(1.3)}}
#pum{position:fixed;z-index:12;left:50%;top:10vh;transform:translateX(-50%);opacity:0;pointer-events:none;font:900 clamp(44px,15vw,120px) "Courier New",monospace;color:#fff;letter-spacing:.05em;text-shadow:0 0 20px #ff9a3b,5px 5px 0 #d62839;white-space:nowrap}
#go{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#010301;color:#ffd54a;font:700 clamp(20px,6vw,36px) "Courier New",monospace;letter-spacing:.08em;text-shadow:0 0 14px rgba(255,200,60,.6)}
#flash{position:fixed;z-index:11;inset:0;background:#fff;opacity:0;pointer-events:none}
</style></head><body>
<div id="pum">¡PUM!</div><div id="msg"></div><div id="flash"></div><div id="go">Toca para empezar</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const TARR=Array.from(new URLSearchParams(location.search).get('msg')||'¡Feliz cumpleaños y feliz Navidad!');
const $=id=>document.getElementById(id),msgEl=$('msg'),pumEl=$('pum'),flashEl=$('flash');
const rnd=Math.random,lerp=(a,b,k)=>a+(b-a)*k,clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),eIn=k=>k*k*k;
/* ---- atlas de letras: N I C O L E * ---- */
const GL=['N','I','C','O','L','E','*'];
const ac=document.createElement('canvas');ac.width=512;ac.height=64;const ax=ac.getContext('2d');
ax.fillStyle='#fff';ax.textAlign='center';ax.textBaseline='middle';ax.font='bold 54px "Courier New",monospace';
GL.forEach((g,i)=>ax.fillText(g,i*64+32,g==='*'?44:34));
const atlas=new THREE.CanvasTexture(ac);
const UT={value:0},US={value:1},UR={value:-9};let ZI=9;
const VS=`uniform float uScale,uTime,uReveal,uAmp;attribute vec3 col;attribute float glyph,size,ph;varying vec3 vC;varying float vG;
void main(){vec4 wp=modelMatrix*vec4(position,1.);vec4 mv=viewMatrix*wp;gl_Position=projectionMatrix*mv;float d=-mv.z;
float f=1.-uAmp+uAmp*pow(abs(sin(uTime*2.6+ph)),3.);float fade=clamp(1.-(d-10.)/20.,.2,1.);
vC=col*f*fade;vG=glyph;gl_PointSize=wp.y>uReveal?0.:size*uScale/d;}`;
const FS=`uniform sampler2D atlas;varying vec3 vC;varying float vG;
void main(){float a=texture2D(atlas,vec2((vG+gl_PointCoord.x)/8.,1.-gl_PointCoord.y)).a;if(a<.2)discard;gl_FragColor=vec4(vC*(.6+.8*a),1.);}`;
const mat=(amp,rev)=>new THREE.ShaderMaterial({uniforms:{atlas:{value:atlas},uTime:UT,uScale:US,uReveal:rev||UR,uAmp:{value:amp}},vertexShader:VS,fragmentShader:FS});
function pts(list,m){
 const n=list.length,P=new Float32Array(n*3),C=new Float32Array(n*3),G=new Float32Array(n),S=new Float32Array(n),H=new Float32Array(n);
 list.forEach((p,i)=>{P.set([p.x,p.y,p.z],i*3);C.set([p.c.r,p.c.g,p.c.b],i*3);G[i]=p.g;S[i]=p.s;H[i]=p.ph||0});
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(P,3));g.setAttribute('col',new THREE.BufferAttribute(C,3));
 g.setAttribute('glyph',new THREE.BufferAttribute(G,1));g.setAttribute('size',new THREE.BufferAttribute(S,1));g.setAttribute('ph',new THREE.BufferAttribute(H,1));
 const o=new THREE.Points(g,m);o.frustumCulled=false;return o;
}
/* ---- escena ---- */
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);
camera.position.set(0,.5,14);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setClearColor(0x010301,1);document.body.appendChild(renderer.domElement);
let controls=null;
if(THREE.OrbitControls){controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.05;controls.minDistance=5;controls.maxDistance=30;controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};}
function onResize(){const pr=Math.min(devicePixelRatio||1,2);renderer.setPixelRatio(pr);renderer.setSize(innerWidth,innerHeight);
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();US.value=innerHeight*pr/(2*Math.tan(30*Math.PI/180));ZI=14-clamp(6.4/(1.155*camera.aspect),6,12);}
addEventListener('resize',onResize);onResize();

/* ---- árbol de letras (como la referencia) ---- */
const treeGroup=new THREE.Group();treeGroup.position.y=.8;scene.add(treeGroup);
const BG=new THREE.Color(0x010301),CB=new THREE.Color(0x0f400f),CT=new THREE.Color(0xaaffaa);
const TH=8.5,MR=4.0,tl=[];
for(let i=0;i<14000;i++){
 const hd=Math.pow(rnd(),2);if(hd<.15&&rnd()>hd*4)continue;
 const y=hd*TH-TH/2,base=MR*(1-hd),th=rnd()*6.2832;
 let sp=1;if(rnd()>.7)sp=(.9+rnd()*.2)+rnd()*.5*(1-hd);
 const r=base*Math.sqrt(rnd())*sp;
 let al=THREE.MathUtils.smoothstep(hd,0,.25);al=.1+al*.9;
 const c=CB.clone().lerp(CT,hd);c.lerp(BG,1-al);
 const h={};c.getHSL(h);c.setHSL(h.h+(rnd()-.5)*.08,clamp(h.s+(rnd()-.5)*.5),clamp(h.l+.1+(rnd()-.5)*.6*al));
 tl.push({x:Math.cos(th)*r,y,z:Math.sin(th)*r,g:Math.random()<.12?6:Math.floor(rnd()*6),s:.15+rnd()*.05,c});
}
treeGroup.add(pts(tl,mat(0)));
/* luces: letras de colores que parpadean */
const LC=[0xff3b3b,0xffd54a,0x4aa8ff,0xff7ad9,0xffffff,0xff9a3b,0x5cff9a],ll=[];
for(let i=0;i<220;i++){
 const hd=Math.pow(rnd(),1.5)*.93,y=hd*TH-TH/2,r=MR*(1-hd)*(.8+.25*rnd()),th=rnd()*6.2832;
 ll.push({x:Math.cos(th)*r,y,z:Math.sin(th)*r,g:Math.floor(rnd()*6),s:.3,c:new THREE.Color(LC[i%7]),ph:rnd()*6.28});
}
treeGroup.add(pts(ll,mat(.85)));
/* estrella de asteriscos que destella */
const sl=[],cy=4.8,OR=.65,IR=.28,vs=[];
for(let i=0;i<10;i++){const a=Math.PI/2+i*Math.PI/5,r=i%2?IR:OR;vs.push({x:Math.cos(a)*r,y:cy+Math.sin(a)*r});}
function inPoly(x,y){let ins=false;for(let i=0,j=vs.length-1;i<vs.length;j=i++){const a=vs[i],b=vs[j];if(((a.y>y)!==(b.y>y))&&(x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x))ins=!ins}return ins}
for(let n=0,t=0;n<700&&t<20000;t++){const x=(rnd()-.5)*2*OR,y=cy+(rnd()-.5)*2*OR;if(!inPoly(x,y))continue;
 const d=Math.hypot(x,y-cy)/OR;sl.push({x,y,z:(rnd()-.5)*.3*(1-d),g:6,s:.14+(1-d)*.1,c:new THREE.Color(rnd()>.06?0xffee00:0xffffff),ph:n*.5});n++;}
const star=pts(sl,mat(.9));star.visible=false;treeGroup.add(star);

/* ---- el puño: de frente, hecho de letras ---- */
const sdC=(x,y,z,ax,ay,az,bx,by,bz,r)=>{const px=x-ax,py=y-ay,pz=z-az,qx=bx-ax,qy=by-ay,qz=bz-az;let h=(px*qx+py*qy+pz*qz)/(qx*qx+qy*qy+qz*qz);h=h<0?0:h>1?1:h;return Math.hypot(px-qx*h,py-qy*h,pz-qz*h)-r};
const smin=(a,b,k)=>{const h=Math.max(k-Math.abs(a-b),0)/k;return Math.min(a,b)-h*h*k*.25};
const FX=[-.54,-.18,.18,.54],FO=[0,.06,.04,-.04];let fm=0;
function fd(x,y,z){
 let s=1e9;
 for(let i=0;i<4;i++){const c=FX[i],o=FO[i];
  s=smin(s,sdC(x,y,z,c,-.08+o,.2,c,.3+o,.14,.175),.05);      // dedo doblado (falange media)
  s=smin(s,sdC(x,y,z,c,-.4+o,.08,c,-.34+o,.08,.13),.05);}     // punta del dedo recogida
 s=smin(s,sdC(x,y,z,-.78,-.78,.1,-.62,-.5,.3,.16),.06);       // base del pulgar
 s=smin(s,sdC(x,y,z,-.62,-.5,.3,.05,-.3,.34,.15),.04);        // pulgar cruzado
 const qx=Math.abs(x)-.6,qy=Math.abs(y+.05)-.35,qz=Math.abs(z+.35)-.1;
 s=smin(s,Math.hypot(Math.max(qx,0),Math.max(qy,0),Math.max(qz,0))+Math.min(Math.max(qx,qy,qz),0)-.2,.08); // palma
 s=smin(s,sdC(x,y,z,0,-.1,-.6,0,-.2,-1.6,.5),.08);            // muñeca
 let d=s;fm=0;
 const cf=sdC(x,y,z,0,-.15,-1.5,0,-.2,-2.1,.62);if(cf<d){d=cf;fm=1}
 const sl=sdC(x,y,z,0,-.2,-2.0,0,-.3,-6,.78)-.025*Math.sin(y*14+z*5);if(sl<d){d=sl;fm=2}
 return d;
}
const LV=new THREE.Vector3(-.4,.6,.7).normalize(),HV=new THREE.Vector3(-.4,.6,1.7).normalize(),fl=[],FSC=3;
function gen(n,x0,x1,y0,y1,z0,z1){
 for(let i=0;i<n;i++){
  const x=lerp(x0,x1,rnd()),y=lerp(y0,y1,rnd()),z=lerp(z0,z1,rnd()),d=fd(x,y,z);
  if(Math.abs(d)>.028)continue;const m=fm,e=.015;
  const gx=fd(x+e,y,z)-d,gy=fd(x,y+e,z)-d,gz=fd(x,y,z+e)-d,l=Math.hypot(gx,gy,gz)||1,nx=gx/l,ny=gy/l,nz=gz/l;
  if(nz<-.25)continue;
  const ao=clamp(fd(x+nx*.1,y+ny*.1,z+nz*.1)/.1);
  const nd=nx*LV.x+ny*LV.y+nz*LV.z,hd=nx*HV.x+ny*HV.y+nz*HV.z;
  const b=clamp((.1+.8*Math.max(0,nd)+.35*Math.pow(Math.max(0,hd),18))*(.3+.7*ao));
  const c=new THREE.Color();
  if(m===0)c.setHSL(.6,.04,.1+.9*b);else if(m===1)c.setHSL(.58,.25,.28+.5*b);else c.setHSL(.99,.82,.08+.4*b);
  fl.push({x:x*FSC,y:y*FSC,z:z*FSC,g:Math.floor(rnd()*6),s:.11,c});
 }
}
gen(260000,-1,1,-1.2,.75,-1.4,.65);gen(70000,-1,1,-1.2,.75,-6.2,-1.4);
const fistG=new THREE.Group();fistG.add(pts(fl,mat(0,{value:99})));scene.add(fistG);

/* ---- línea de tiempo ---- */
const TI=2.0,TR=3.4,TRD=2.8,TS=TR+TRD;
let t0=null,lastN=-1,lastDown=0;
function replay(){t0=performance.now();msgEl.textContent='';lastN=-1;star.visible=false;fistG.visible=true;}
addEventListener('pointerdown',()=>{const n=performance.now();if(t0===null){t0=n;document.getElementById('go').style.display='none';}else if(n-lastDown<300)replay();lastDown=n;});
function animate(){
 requestAnimationFrame(animate);
 if(t0===null){renderer.render(scene,camera);return}
 const t=(performance.now()-t0)/1000,since=t-TI;UT.value=t;
 treeGroup.rotation.y+=.008;star.rotation.y-=.016;
 if(controls)controls.update();
 if(t<TI){const k=Math.pow(t/TI,1.8);fistG.position.set(0,.3,lerp(-14,ZI,k));}
 else if(t<TI+.4){fistG.position.set((rnd()-.5)*.06,.3+(rnd()-.5)*.06,ZI);}
 else if(t<TI+1.1){const k=(t-TI-.4)/.7;fistG.position.set(0,.3,lerp(ZI,-30,k*k));}
 else fistG.visible=false;
 UR.value=t<TR?-9:lerp(-4.5,7,clamp((t-TR)/TRD));
 if(t>=TS)star.visible=true;
 const amp=since>0?14*Math.exp(-since*6):0;
 renderer.domElement.style.transform=`translate(${(rnd()-.5)*2*amp}px,${(rnd()-.5)*2*amp}px)`;
 flashEl.style.opacity=since>0?.6*Math.exp(-since*9):0;
 if(since>0&&since<1.8){const k=since/1.8;pumEl.style.opacity=1-Math.max(0,(k-.55)/.45);pumEl.style.transform=`translateX(-50%) rotate(-8deg) scale(${.5+.9*(1-Math.pow(1-Math.min(1,k*4),3))})`}else pumEl.style.opacity=0;
 const n=clamp(Math.floor((t-TR-.1)*13),0,TARR.length);
 if(n!==lastN){lastN=n;msgEl.textContent=TARR.slice(0,n).join('');
  if(n===TARR.length){const s=document.createElement('span');s.id='emo';s.textContent=' :p';msgEl.appendChild(s)}}
 renderer.render(scene,camera);
}
animate();

/* ---- música: We Wish You a Merry Christmas (melodía de dominio público) ---- */
const music=(()=>{
 const N={D4:293.66,E4:329.63,F4:369.99,G4:392,A4:440,B4:493.88,C5:523.25};
 const M=[[N.D4,1],[N.G4,1],[N.G4,.5],[N.A4,.5],[N.G4,.5],[N.F4,.5],[N.E4,1],[N.E4,1],[N.E4,1],[N.A4,1],[N.A4,.5],[N.B4,.5],[N.A4,.5],[N.G4,.5],
 [N.F4,1],[N.F4,1],[N.D4,1],[N.B4,1],[N.B4,.5],[N.C5,.5],[N.B4,.5],[N.A4,.5],[N.G4,1],[N.E4,1],[N.D4,.5],[N.D4,.5],[N.E4,1],[N.A4,1],[N.F4,1],[N.G4,2],[0,1.5]];
 const B=.34;let ctx=null,on=false,tm=null;
 function note(t,f,b){if(!f)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;const d=b*B;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d*.95);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d)}
 function loop(){let t=ctx.currentTime+.02;for(const [f,b] of M){note(t,f,b);t+=b*B}tm=setTimeout(()=>{if(on)loop()},(t-ctx.currentTime-.2)*1000)}
 return{start(){if(on)return;if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();
  ctx.resume().then(()=>{if(ctx.state==='running'&&!on){on=true;loop()}}).catch(()=>{})}};
})();
['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,()=>music.start(),{once:true}));
</script></body></html>
